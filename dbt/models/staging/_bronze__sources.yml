version: 2

sources:
  - name: bronze
    description: >
      Raw, unmodified game telemetry. The client and simulator append here and
      nothing else writes to it, so bronze is always replayable: every silver
      view and gold mart below can be rebuilt from this table alone.
    database: "{{ env_var('SNOWFLAKE_DATABASE', 'SNOWPITCH') if target.type == 'snowflake' else 'snowpitch' }}"
    schema: "{{ 'BRONZE' if target.type == 'snowflake' else 'main' }}"

    tables:
      - name: raw_events
        identifier: "{{ 'RAW_EVENTS' if target.type == 'snowflake' else 'bronze_events' }}"
        description: One row per emitted game event, payload kept as JSON.
        loaded_at_field: ts
        freshness:
          warn_after: {count: 12, period: hour}
          error_after: {count: 72, period: hour}
        columns:
          - name: event_id
            description: Client-generated idempotency key.
            data_tests:
              - not_null
              - unique
          - name: event_type
            description: Discriminator that decides which silver view claims the row.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - player_snapshot
                      - match_start
                      - match_end
                      - chance
                      - goal
                      - pack_open
                      - market_sale
          - name: ts
            description: Event time in UTC.
            data_tests:
              - not_null
          - name: player_id
            description: Actor who caused the event.
            data_tests:
              - not_null
          - name: payload
            description: Event-specific JSON body, unpacked in staging.
