snowpitch:
  target: "{{ env_var('DBT_TARGET', 'duckdb') }}"
  outputs:

    # Local development. No credentials, no cloud spend, same models.
    duckdb:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '../data/snowpitch.duckdb') }}"
      schema: main
      threads: 4

    # Production. Reads the same models against the real Snowflake trial.
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'ACCOUNTADMIN') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'SNOWPITCH') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'PUBLIC') }}"
      threads: 8
      client_session_keep_alive: false
